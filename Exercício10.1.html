<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Cantoras</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f4f8;
      padding: 30px;
    }

    .container {
      display: flex;
      gap: 20px;
      align-items: flex-start;
    }

    .buttons, .lyrics, .photo, .video {
      background: white;
      padding: 15px;
      border-radius: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    .buttons {
      width: 150px;
    }

    button {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      border: none;
      border-radius: 8px;
      background: #6d28d9;
      color: white;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover {
      background: #5b21b6;
    }

    .lyrics {
      width: 300px;
      min-height: 220px;
      line-height: 1.5;
    }

    .photo {
      width: 220px;
      text-align: center;
    }

    .photo img {
      width: 100%;
      border-radius: 10px;
    }

    .video {
      width: 360px;
    }

    iframe {
      width: 100%;
      height: 220px;
      border-radius: 10px;
      border: none;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="buttons">
      <button onclick="showArtist('shakira')">Shakira</button>
      <button onclick="showArtist('gaga')">Lady Gaga</button>
      <button onclick="showArtist('madonna')">Madonna</button>
    </div>

    <div class="lyrics" id="lyricsBox">
      Clique em uma cantora para ver um trecho da música.
    </div>

    <div class="photo">
      <img id="artistImage" src="https://wallpapers.com/images/hd/singer-shakira-portrait-871mvituhvbv5mrv.jpg" alt="Imagem da artista">
    </div>

    <div class="video" id="videoMusic"> 
      <H3>Hips don't lie</H3>
    </div>

  </div>

  <script>
    function showArtist(artist) {
      const lyricsBox = document.getElementById("lyricsBox");
      const videoMusic = document.getElementById("videoMusic")
      const image = document.getElementById("artistImage");
     // const video = document.getElementById("artistVideo");

      if (artist === "shakira") {
        lyricsBox.innerHTML = `
          <strong>Hips don't lie</strong><br><br>
          I'm on tonight <br>
          You know my hips don't lie (no fighting, no fighting) <br>
          And I'm starting to feel it's right <br>
          All the attraction, the tension <br>
          Don't you see, baby? This is perfection <br>
        `;
        videoMusic.innerHTML = `
        <H3>Hips don't lie</H3>
        `
        image.src = "img/Shakira.webp";
        video.src = "https://www.youtube.com/embed/DUT5rEU6pqM";
      }

      else if (artist === "gaga") {
        lyricsBox.innerHTML = `
          <strong>Abracadabra</strong><br><br>
          Abracadabra, amor, ooh-na-na
          Abracadabra, morta, ooh-ga-ga
          Abracadabra, abra, ooh-na-na
          In her tongue, she said
          Death or love tonight
        `;
        videoMusic.innerHTML = `
        <H3>Abracadabra</H3>
        `
        image.src = "img/Gaga.webp";
        video.src = "https://www.youtube.com/embed/wV1FrqwZyKw";
      }

      else if (artist === "madonna") {
        lyricsBox.innerHTML = `
          <strong>Material Girl</strong><br><br>
          'Cause we are living in a material world
          And I am a material girl
          You know that we are living in a material world
          And I am a material girl
        `;
        videoMusic.innerHTML = `
        <H3>Material Girl</H3>
        `
        image.src = "img/Madonna.webp";;
        video.src = "https://www.youtube.com/embed/79fzeNUqQbQ";
      }
    }
  </script>

</body>
</html>
