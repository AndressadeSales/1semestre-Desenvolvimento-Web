<!DOCTYPE html>

<html lang="pt-br">

<head>

    <meta charset="UTF-8">
    <title>Exercício Grid</title>
    <link rel="stylesheet" href="Atividade6.2.css">

</head>

<body>

    <h1>Exercício de CSS Grid</h2>

    <!-- GRID 1 -->
    <h2>Grid 1</h2>
    <div class="container">
        <div class="grid1">
            <div>A</div>
            <div>B</div>
            <div>C</div>
            <div>D</div>
        </div>
    </div>

    <!-- GRID 2 -->
    <h2>Grid 2</h2>
    <div class="container">
        <div class="grid2">
            <div>1</div>
            <div>2</div>
            <div>3</div>
        </div>
    </div>

    <!-- GRID 3 -->
    <h2>Grid 3</h2>
    <div class="container">
        <div class="grid3">
            <div class="x">X</div>
            <div>Y</div>
            <div>Z</div>
        </div>
    </div>

    <!-- GRID 4 -->
    <h2>Grid 4</h2>
    <div class="container">
        <div class="grid4">
            <div>🍎</div>
            <div>🍊</div>
            <div>🍇</div>
            <div>🍉</div>
        </div>
    </div>

</body>

</html>
