<!DOCTYPE html>

<html lang="pt-br">

<head>

    <meta charset="UTF-8">
    <title>Exercício 6.1</title>
    <link rel="stylesheet" href="Exemplo6.1.css">

</head>

<body>

    <h2>1. Layout padrão (block)</h2>

    <div class="bloco">Div 1 ocupa toda a largura</div>
    <div class="bloco">Div 2 abaixo da anterior</div>


    <h2>2. Inline-block</h2>

    <div class="inline">A</div>
    <div class="inline">B</div>
    <div class="inline">C</div>


    <h2>3. Flexbox</h2>

    <div class="flex-container">
        <div class="flex">1</div>
        <div class="flex">2</div>
        <div class="flex">3</div>
    </div>


    <h2>4. Grid</h2>

    <div class="grid-container">
        <div class="grid">1</div>
        <div class="grid">2</div>
        <div class="grid">3</div>
        <div class="grid">4</div>
    </div>

</body>

</html>
